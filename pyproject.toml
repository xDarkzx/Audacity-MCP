[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audacity-mcp"
version = "0.1.15"
description = "MCP server for AI-driven audio editing in Audacity via mod-script-pipe"
license = "Apache-2.0"
authors = [
    { name = "Daniel Hodgetts" },
]
readme = "README.md"
keywords = ["audacity", "mcp", "audio", "ai", "model-context-protocol", "mastering", "transcription"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
requires-python = ">=3.10"
dependencies = [
    # Upper-bounded deliberately: mcp 2.0.0 is a real, confirmed breaking
    # release (removed/restructured mcp.server.fastmcp, which every tool
    # module in this project imports) that broke CI on a commit that
    # changed nothing dependency-related - a fresh `pip install` alone
    # was enough to pull it in under the old unbounded ">=1.0.0" pin.
    # Bump the ceiling only after actually testing against a real 2.x
    # release. (Same issue hit and fixed the same way across this user's
    # other MCP-server repos: SongForge-MCP, Reaper-MCP.)
    "mcp[cli]>=1.0.0,<2.0.0",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["audacity_mcp", "audacity_mcp_shared"]

[project.scripts]
audacity-mcp = "audacity_mcp.main:main"
audacity-mcp-setup-gpu = "audacity_mcp.setup_transcription:main"
